name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SKILL.md frontmatter, references, and agents/openai.yaml
        run: python3 scripts/validate_skills.py

      - name: Forward-test skill helpers
        # Office integration (LibreOffice/poppler) is skippable: installing those
        # packages on GitHub-hosted runners is flaky, and the helpers skip when
        # soffice is absent. Do not add LibreOffice packages to this job.
        run: python3 scripts/forward_test.py

      - name: Check install.sh syntax
        run: bash -n install.sh

      - name: Check for whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  install-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run install.sh into a temp HOME
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME/.codex/skills/csv"
          echo "occupied" > "$HOME/.codex/skills/csv/keep.txt"
          mkdir -p "$HOME/.grok/skills" "$RUNNER_TEMP/other-docx"
          ln -s "$RUNNER_TEMP/other-docx" "$HOME/.grok/skills/docx"
          bash ./install.sh
          test -d "$HOME/.codex/skills/csv"
          test ! -L "$HOME/.codex/skills/csv"
          test -L "$HOME/.codex/skills/docx"
          test "$(readlink "$HOME/.grok/skills/docx")" = "$RUNNER_TEMP/other-docx"
          test -L "$HOME/.grok/skills/csv"
          test -L "$HOME/.claude/skills/ics"
          test -L "$HOME/.cursor/skills/xlsx"

  # Optional office path. LibreOffice + poppler are large and occasionally fail on
  # hosted runners; keep validate / install-macos green even if this job is red.
  office:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice and poppler
        id: pkgs
        run: |
          if sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libreoffice-core poppler-utils; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
            echo "office packages unavailable; skipping LibreOffice forward-test"
          fi

      - name: Forward-test with LibreOffice
        if: steps.pkgs.outputs.installed == 'true'
        run: python3 scripts/forward_test.py

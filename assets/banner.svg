<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Agent Skills</title>
  <desc id="desc">A modular skills library for capable, careful AI agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10273D"/>
      <stop offset="0.58" stop-color="#17324D"/>
      <stop offset="1" stop-color="#0C202F"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21A69C"/>
      <stop offset="1" stop-color="#167C76"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#B9D9D5" stroke-opacity="0.065"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#06131D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#background)"/>
  <rect width="1400" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1275" cy="45" r="230" fill="#D49A32" opacity="0.075"/>
  <circle cx="1115" cy="415" r="270" fill="#21A69C" opacity="0.065"/>

  <g transform="translate(92 85)" filter="url(#shadow)">
    <rect width="250" height="250" rx="54" fill="#F7F5EF"/>
    <g transform="translate(38 38)">
      <rect width="80" height="80" rx="20" fill="url(#mark)"/>
      <rect x="94" width="80" height="80" rx="20" fill="#D49A32"/>
      <rect y="94" width="80" height="80" rx="20" fill="#17324D"/>
      <path d="M134 99l40 23v46l-40 23-40-23v-46z" transform="translate(0 -8)" fill="#E7EFEF" stroke="#167C76" stroke-width="8"/>
      <circle cx="134" cy="137" r="14" fill="#167C76"/>
      <path d="M118 137H85M150 137h31M134 121V86M134 153v30" stroke="#167C76" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(410 104)">
    <text x="0" y="74" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="760" letter-spacing="-2">Agent Skills</text>
    <text x="2" y="124" fill="#A7C7C4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650" letter-spacing="3.4">MODULAR · PORTABLE · SAFETY-FIRST</text>
    <line x1="2" y1="158" x2="745" y2="158" stroke="#D49A32" stroke-width="3" opacity="0.8"/>
    <text x="2" y="207" fill="#DCE7ED" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25">Practical operating knowledge for capable AI agents.</text>
  </g>

  <g transform="translate(1125 295)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="8" fill="#D49A32" stroke="none"/>
    <circle cx="70" cy="-35" r="8" fill="#21A69C" stroke="none"/>
    <circle cx="135" cy="16" r="8" fill="#F7F5EF" stroke="none"/>
    <path d="M8-4l54-27M77-30l50 40M8 3l119 10" stroke="#A7C7C4" stroke-width="3" opacity="0.55"/>
  </g>
